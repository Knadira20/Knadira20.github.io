<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Kad Memori Pembelajaran</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            min-height: 100vh;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Outfit', sans-serif;
        }
        
        /* 3D Card Flip Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .card-front {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }
        .card-back {
            background-color: #ffffff;
            transform: rotateY(180deg);
            border: 2px solid #e2e8f0;
        }
        
        /* Matched animation effect */
        @keyframes pulse-success {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .matched-anim {
            animation: pulse-success 0.4s ease-in-out;
        }

        /* Custom Scrollbar for Modal/Inputs */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen p-3 md:p-6">

    <!-- Header & Navigation -->
    <header class="max-w-5xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
        <div class="flex items-center gap-3 text-center sm:text-left">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg text-2xl">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">Kad Memori <span class="text-indigo-600">Pintar</span></h1>
                <p class="text-xs sm:text-sm font-medium text-slate-500">Permainan Padanan Pembelajaran Interaktif</p>
            </div>
        </div>

        <!-- Controls / Buttons -->
        <div class="flex items-center gap-2 flex-wrap justify-center">
            <button id="btn-custom-topic" class="bg-white hover:bg-slate-50 text-slate-700 font-semibold px-4 py-2 rounded-xl border border-slate-200 shadow-sm transition-all flex items-center gap-2 text-sm">
                <i class="fa-solid fa-plus text-indigo-500"></i> Cipta Soalan
            </button>
            <button id="btn-sound-toggle" class="bg-white hover:bg-slate-50 text-slate-700 p-2.5 rounded-xl border border-slate-200 shadow-sm transition-all text-sm w-10 h-10 flex items-center justify-center">
                <i class="fa-solid fa-volume-high text-emerald-500" id="sound-icon"></i>
            </button>
            <button id="btn-restart" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-xl shadow-md shadow-indigo-200 transition-all text-sm flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Mula Semula
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="max-w-5xl mx-auto w-full flex-grow flex flex-col gap-6">

        <!-- Topic Selector & Game Stats Bar -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4 items-center justify-between">
            <!-- Topic Selection -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label for="topic-select" class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-wider whitespace-nowrap">Topik:</label>
                <select id="topic-select" class="w-full md:w-64 bg-slate-50 border border-slate-200 text-slate-700 font-semibold py-2 px-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <!-- Dashboard Stats -->
            <div class="flex items-center justify-around w-full md:w-auto gap-4 sm:gap-8 bg-slate-50 py-2 px-4 rounded-xl border border-slate-100">
                <div class="text-center">
                    <span class="text-xs font-semibold text-slate-400 block uppercase">Masa</span>
                    <span id="timer" class="text-lg font-bold text-slate-700 font-mono">00:00</span>
                </div>
                <div class="w-px h-8 bg-slate-200"></div>
                <div class="text-center">
                    <span class="text-xs font-semibold text-slate-400 block uppercase">Langkah</span>
                    <span id="moves-count" class="text-lg font-bold text-slate-700">0</span>
                </div>
                <div class="w-px h-8 bg-slate-200"></div>
                <div class="text-center">
                    <span class="text-xs font-semibold text-slate-400 block uppercase">Padanan</span>
                    <span id="matches-count" class="text-lg font-bold text-emerald-600">0 / 0</span>
                </div>
            </div>
        </div>

        <!-- Dynamic Game Grid Container -->
        <div class="flex-grow flex items-center justify-center min-h-[350px]">
            <div id="game-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-4 gap-3 sm:gap-4 w-full max-w-4xl">
                <!-- Cards injected by JS -->
            </div>
        </div>
    </main>

    <!-- Custom Topic Modal -->
    <div id="modal-custom" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-lg w-full p-6 flex flex-col max-h-[90vh] transition-all">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> Cipta Kad Sendiri
                </h3>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="my-4 space-y-4 overflow-y-auto pr-1">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nama Topik Custom</label>
                    <input type="text" id="custom-topic-title" placeholder="Cth: Matematik Tambah Asas" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-bold text-slate-500 uppercase">Pasangan Kad (Min: 4, Max: 8)</label>
                        <span class="text-xs text-slate-400">Gandingan Kad A & Kad B</span>
                    </div>

                    <div id="custom-pairs-container" class="space-y-2">
                        <!-- Pair Row Inputs -->
                    </div>

                    <button id="btn-add-pair" class="w-full py-2 border-2 border-dashed border-slate-200 hover:border-indigo-400 text-slate-500 hover:text-indigo-600 font-semibold rounded-xl text-xs flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-plus"></i> Tambah Pasangan Kad
                    </button>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-100 flex gap-3">
                <button id="btn-cancel-custom" class="w-1/2 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-all">Batal</button>
                <button id="btn-save-custom" class="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-all shadow-md shadow-indigo-200">Simpan & Main</button>
            </div>

    <!-- Victory Modal Overlay -->
    <div id="modal-victory" class="fixed inset-0 bg-slate-900/50 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full p-6 sm:p-8 text-center flex flex-col items-center animate-bounce-short">
            <div class="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner">
                <i class="fa-solid fa-trophy"></i>
            </div>
            
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-1">Syabas & Tahniah!</h2>
            <p class="text-slate-500 text-sm mb-6">Anda berjaya menyelesaikan semua padanan kad!</p>

            <!-- Star Ratings -->
            <div id="star-rating" class="flex justify-center gap-2 text-3xl text-amber-400 mb-6">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
            </div>

            <!-- Stats Summary -->
            <div class="grid grid-cols-2 gap-3 w-full bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100">
                <div class="text-center">
                    <span class="text-xs font-semibold text-slate-400 block">Masa Diambil</span>
                    <span id="final-time" class="text-base font-bold text-slate-700">00:00</span>
                </div>
                <div class="text-center">
                    <span class="text-xs font-semibold text-slate-400 block">Jumlah Langkah</span>
                    <span id="final-moves" class="text-base font-bold text-slate-700">0</span>
                </div>
            </div>

            <button id="btn-play-again" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> Main Lagi
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // Preset Topics Database
        const PRESET_TOPICS = {
            'bm-sinonim': {
                name: 'Bahasa Melayu: Sinonim',
                icon: 'fa-book-open',
                pairs: [
                    { item1: 'Pantas', item2: 'Laju' },
                    { item1: 'Cepat', item2: 'Pantas' },
                    { item1: 'Cantik', item2: 'Indah' },
                    { item1: 'Bijak', item2: 'Pintar' },
                    { item1: 'Gembira', item2: 'Seronok' },
                    { item1: 'Besar', item2: 'Agong' }
                ]
            },
            'sains-habitat': {
                name: 'Sains: Haiwan & Habitat',
                icon: 'fa-leaf',
                pairs: [
                    { item1: 'Ikan 🐟', item2: 'Laut / Air' },
                    { item1: 'Burung 🐦', item2: 'Sarang' },
                    { item1: 'Kuda 🐎', item2: 'Kandang' },
                    { item1: 'Cacing 🪱', item2: 'Tanah' },
                    { item1: 'Lebah 🐝', item2: 'Sarang Lebah' },
                    { item1: 'Katak 🐸', item2: 'Dua Alam' }
                ]
            },
            'math-sifir': {
                name: 'Matematik: Operasi Darab',
                icon: 'fa-calculator',
                pairs: [
                    { item1: '2 × 3', item2: '6' },
                    { item1: '4 × 4', item2: '16' },
                    { item1: '5 × 6', item2: '30' },
                    { item1: '7 × 3', item2: '21' },
                    { item1: '8 × 2', item2: '16' },
                    { item1: '9 × 5', item2: '45' }
                ]
            },
            'bi-vocab': {
                name: 'English: Vocabulary',
                icon: 'fa-language',
                pairs: [
                    { item1: 'Apple 🍎', item2: 'Epal' },
                    { item1: 'Cat 🐱', item2: 'Kucing' },
                    { item1: 'Sun ☀️', item2: 'Matahari' },
                    { item1: 'Book 📖', item2: 'Buku' },
                    { item1: 'House 🏠', item2: 'Rumah' },
                    { item1: 'Water 💧', item2: 'Air' }
                ]
            }
        };

        // Web Audio Synthesizer for SFX
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }

            playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.00001, this.ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { console.error(e); }
            }

            playFlip() {
                this.init();
                this.playTone(400, 'sine', 0.08, 0.05);
            }

            playMatch() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                this.playTone(523.25, 'triangle', 0.1, 0.1); // C5
                setTimeout(() => this.playTone(659.25, 'triangle', 0.15, 0.1), 80); // E5
                setTimeout(() => this.playTone(783.99, 'triangle', 0.2, 0.1), 160); // G5
            }

            playMismatch() {
                this.init();
                this.playTone(220, 'sawtooth', 0.15, 0.05); // A3
                setTimeout(() => this.playTone(180, 'sawtooth', 0.2, 0.05), 100);
            }

            playVictory() {
                this.init();
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.3, 0.12), idx * 120);
                });
            }
        }

        const soundManager = new SoundManager();

        // Game State Variables
        let currentTopicKey = 'bm-sinonim';
        let customTopics = {};
        let cardsData = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 0;
        let moves = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isBoardLocked = false;

        // DOM Elements
        const topicSelect = document.getElementById('topic-select');
        const gameGrid = document.getElementById('game-grid');
        const movesCounter = document.getElementById('moves-count');
        const matchesCounter = document.getElementById('matches-count');
        const timerDisplay = document.getElementById('timer');
        const btnRestart = document.getElementById('btn-restart');
        const btnSoundToggle = document.getElementById('sound-icon');
        
        // Custom Modal DOM
        const modalCustom = document.getElementById('modal-custom');
        const btnCustomTopic = document.getElementById('btn-custom-topic');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelCustom = document.getElementById('btn-cancel-custom');
        const btnSaveCustom = document.getElementById('btn-save-custom');
        const btnAddPair = document.getElementById('btn-add-pair');
        const customPairsContainer = document.getElementById('custom-pairs-container');
        const customTopicTitleInput = document.getElementById('custom-topic-title');

        // Victory Modal DOM
        const modalVictory = document.getElementById('modal-victory');
        const btnPlayAgain = document.getElementById('btn-play-again');
        const finalTime = document.getElementById('final-time');
        const finalMoves = document.getElementById('final-moves');
        const starRating = document.getElementById('star-rating');

        // Initialize Application
        function initApp() {
            populateTopicDropdown();
            setupEventListeners();
            startNewGame();
        }

        // Populate dropdown options with presets + custom items
        function populateTopicDropdown() {
            topicSelect.innerHTML = '';
            
            // Add Preset Options
            const presetGroup = document.createElement('optgroup');
            presetGroup.label = "Topik Sedia Ada";
            Object.keys(PRESET_TOPICS).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = PRESET_TOPICS[key].name;
                presetGroup.appendChild(opt);
            });
            topicSelect.appendChild(presetGroup);

            // Add Custom Options if present
            if (Object.keys(customTopics).length > 0) {
                const customGroup = document.createElement('optgroup');
                customGroup.label = "Topik Ciptaan Anda";
                Object.keys(customTopics).forEach(key => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = customTopics[key].name;
                    customGroup.appendChild(opt);
                });
                topicSelect.appendChild(customGroup);
            }

            topicSelect.value = currentTopicKey;
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Change topic
            topicSelect.addEventListener('change', (e) => {
                currentTopicKey = e.target.value;
                startNewGame();
            });

            // Restart button
            btnRestart.addEventListener('click', startNewGame);

            // Sound Toggle
            document.getElementById('btn-sound-toggle').addEventListener('click', () => {
                soundManager.enabled = !soundManager.enabled;
                if (soundManager.enabled) {
                    btnSoundToggle.className = "fa-solid fa-volume-high text-emerald-500";
                } else {
                    btnSoundToggle.className = "fa-solid fa-volume-xmark text-slate-400";
                }
            });

            // Custom Topic Modal Handlers
            btnCustomTopic.addEventListener('click', openCustomModal);
            btnCloseModal.addEventListener('click', closeCustomModal);
            btnCancelCustom.addEventListener('click', closeCustomModal);
            btnAddPair.addEventListener('click', addCustomPairRow);
            btnSaveCustom.addEventListener('click', saveCustomTopic);

            // Play Again
            btnPlayAgain.addEventListener('click', () => {
                modalVictory.classList.add('hidden');
                startNewGame();
            });
        }

        // Start / Reset Game
        function startNewGame() {
            // Reset Stats
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isBoardLocked = false;
            movesCounter.textContent = moves;

            // Reset Timer
            clearInterval(timerInterval);
            secondsElapsed = 0;
            timerDisplay.textContent = '00:00';
            startTimer();

            // Fetch Pairs for Current Topic
            let topicData = PRESET_TOPICS[currentTopicKey] || customTopics[currentTopicKey];
            if (!topicData) {
                currentTopicKey = 'bm-sinonim';
                topicData = PRESET_TOPICS[currentTopicKey];
            }

            totalPairs = topicData.pairs.length;
            matchesCounter.textContent = `0 / ${totalPairs}`;

            // Build Double Card Array (One for item1, one for item2, sharing pairId)
            cardsData = [];
            topicData.pairs.forEach((pair, index) => {
                cardsData.push({
                    id: `card-${index}-a`,
                    pairId: index,
                    text: pair.item1
                });
                cardsData.push({
                    id: `card-${index}-b`,
                    pairId: index,
                    text: pair.item2
                });
            });

            // Shuffle Cards
            cardsData.sort(() => Math.random() - 0.5);

            // Render Board Grid
            renderBoard();
        }

        // Timer Logic
        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        // Render Cards inside HTML
        function renderBoard() {
            gameGrid.innerHTML = '';
            
            // Adjust Grid Columns dynamically depending on card count
            if (cardsData.length <= 8) {
                gameGrid.className = "grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 w-full max-w-2xl";
            } else if (cardsData.length <= 12) {
                gameGrid.className = "grid grid-cols-3 sm:grid-cols-4 gap-3 sm:gap-4 w-full max-w-3xl";
            } else {
                gameGrid.className = "grid grid-cols-3 sm:grid-cols-4 md:grid-cols-4 gap-3 sm:gap-4 w-full max-w-4xl";
            }

            cardsData.forEach((card) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective-1000 aspect-[4/3] cursor-pointer select-none';
                cardEl.dataset.id = card.id;
                cardEl.dataset.pairId = card.pairId;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front hover:bg-blue-700 transition-colors">
                            <i class="fa-solid fa-question text-xl sm:text-2xl text-blue-200"></i>
                        </div>
                        <div class="card-back p-2 text-center">
                            <span class="text-xs sm:text-sm font-bold text-slate-800 leading-tight">${escapeHtml(card.text)}</span>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(cardEl));
                gameGrid.appendChild(cardEl);
            });
        }

        // Handle Card Flipping & Game Logic
        function handleCardClick(cardEl) {
            // Prevent interaction if locked or card already flipped/matched
            if (isBoardLocked) return;
            if (cardEl.classList.contains('flipped')) return;

            soundManager.playFlip();

            // Flip Card
            cardEl.classList.add('flipped');
            flippedCards.push(cardEl);

            // Check if two cards are flipped
            if (flippedCards.length === 2) {
                moves++;
                movesCounter.textContent = moves;
                checkMatch();
            }
        }

        // Match Checking Logic
        function checkMatch() {
            isBoardLocked = true;
            const [card1, card2] = flippedCards;

            const pair1 = card1.dataset.pairId;
            const pair2 = card2.dataset.pairId;

            if (pair1 === pair2) {
                // MATCH SUCCESS
                setTimeout(() => {
                    soundManager.playMatch();
                    
                    // Style as Matched
                    card1.querySelector('.card-back').classList.add('bg-emerald-50', 'border-emerald-400');
                    card2.querySelector('.card-back').classList.add('bg-emerald-50', 'border-emerald-400');
                    card1.classList.add('matched-anim');
                    card2.classList.add('matched-anim');

                    matchedPairs++;
                    matchesCounter.textContent = `${matchedPairs} / ${totalPairs}`;
                    flippedCards = [];
                    isBoardLocked = false;

                    // Check Victory
                    if (matchedPairs === totalPairs) {
                        setTimeout(handleVictory, 500);
                    }
                }, 300);
            } else {
                // MISMATCH
                setTimeout(() => {
                    soundManager.playMismatch();
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isBoardLocked = false;
                }, 1000);
            }
        }

        // Victory Screen Handler
        function handleVictory() {
            clearInterval(timerInterval);
            soundManager.playVictory();

            finalTime.textContent = timerDisplay.textContent;
            finalMoves.textContent = moves;

            // Rating Stars calculation (based on minimum moves possible: totalPairs)
            let stars = 3;
            if (moves > totalPairs * 2) stars = 2;
            if (moves > totalPairs * 3) stars = 1;

            starRating.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                if (i < stars) {
                    starRating.innerHTML += `<i class="fa-solid fa-star"></i>`;
                } else {
                    starRating.innerHTML += `<i class="fa-regular fa-star text-slate-300"></i>`;
                }
            }

            modalVictory.classList.remove('hidden');
        }

        // Custom Topic Modal Functions
        function openCustomModal() {
            customPairsContainer.innerHTML = '';
            customTopicTitleInput.value = '';
            
            // Add initial 4 pairs default
            for (let i = 0; i < 4; i++) {
                addCustomPairRow();
            }

            modalCustom.classList.remove('hidden');
        }

        function closeCustomModal() {
            modalCustom.classList.add('hidden');
        }

        function addCustomPairRow() {
            const currentRows = customPairsContainer.children.length;
            if (currentRows >= 8) {
                alert('Maksimum 8 pasangan sahaja dibenarkan.');
                return;
            }

            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 pair-row';
            row.innerHTML = `
                <input type="text" placeholder="Kad A (Cth: Soalan)" class="w-1/2 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 pair-a">
                <i class="fa-solid fa-arrows-rotate text-slate-300 text-xs"></i>
                <input type="text" placeholder="Kad B (Cth: Jawapan)" class="w-1/2 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 pair-b">
                ${currentRows >= 4 ? `<button class="text-rose-400 hover:text-rose-600 px-1 btn-del-row"><i class="fa-solid fa-trash"></i></button>` : ''}
            `;

            // Delete row listener if added
            const delBtn = row.querySelector('.btn-del-row');
            if (delBtn) {
                delBtn.addEventListener('click', () => row.remove());
            }

            customPairsContainer.appendChild(row);
        }

        function saveCustomTopic() {
            const title = customTopicTitleInput.value.trim() || 'Topik Custom Saya';
            const rows = customPairsContainer.querySelectorAll('.pair-row');
            const pairs = [];

            rows.forEach(row => {
                const valA = row.querySelector('.pair-a').value.trim();
                const valB = row.querySelector('.pair-b').value.trim();

                if (valA && valB) {
                    pairs.push({ item1: valA, item2: valB });
                }
            });

            if (pairs.length < 4) {
                alert('Sila lengkapkan sekurang-kurangnya 4 pasangan kad.');
                return;
            }

            const customKey = `custom-${Date.now()}`;
            customTopics[customKey] = {
                name: `✏️ ${title}`,
                pairs: pairs
            };

            currentTopicKey = customKey;
            populateTopicDropdown();
            closeCustomModal();
            startNewGame();
        }

        // Utility: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Run application on load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
